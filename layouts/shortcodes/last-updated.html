{{- /* last-updated "2026-07-12"          -> "Last updated: July 12, 2026"
       last-updated "2026-09-01" "month" -> "Last updated: September 2026"  (for month-precision notes) */ -}}
<div class="last-updated">Last updated: {{ .Get 0 | time.Format (cond (eq (.Get 1) "month") "January 2006" "January 2, 2006") }}</div>
