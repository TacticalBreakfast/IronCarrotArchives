version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    # Disable the cooldown window. As of 2026-07-14 Dependabot applies a default 3-day
    # package cooldown (https://github.blog/changelog/2026-07-14-dependabot-version-updates-introduce-default-package-cooldown/).
    # Dependabot only evaluates the newest submodule commit and falls back to the currently
    # pinned one if that commit is still inside the cooldown period. ArknightsGuideAssets
    # receives auto-sync commits near-daily, so under the 3-day default the newest commit is
    # perpetually too fresh, the window never elapses, and no PR is ever opened.
    cooldown:
      default-days: 0
    # Only update the game assets submodule, not themes/blowfish. For the gitsubmodule
    # ecosystem the dependency name is the submodule path, as it appears in the update log
    # ("Checking if assets/game_img <sha> needs updating").
    allow:
      - dependency-name: "assets/game_img"
