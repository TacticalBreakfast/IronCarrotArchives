version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    # Exclude the theme rather than allow-listing the assets submodule: an `allow` filter
    # that fails to match silently drops every update, whereas an `ignore` filter that
    # fails to match merely lets an unwanted Blowfish PR through, which is easy to close.
    ignore:
      - dependency-name: "themes/blowfish"
