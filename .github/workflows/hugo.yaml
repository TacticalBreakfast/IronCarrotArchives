name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  regenerate:
    # Rebuilds data/efficiencies/*.json (tools/build_item_values.py) when any of
    # its inputs changed -- usually game data arriving via the assets submodule
    # -- and commits the result back, so the repo holds what is deployed. The
    # commit message summarises what changed; `git log -- data/efficiencies/`
    # is the change log. Most runs change nothing and take a few seconds.
    #
    # The only job allowed to write to the repo. Pushes made with this token
    # don't trigger another run, so there is no loop; the build below uses the
    # regenerated files directly (artifact), whether or not the push lands.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Regenerate efficiency data
        run: python3 tools/build_item_values.py --summary "${RUNNER_TEMP}/summary.txt"
      - name: Commit and push
        run: |
          if [ ! -f "${RUNNER_TEMP}/summary.txt" ]; then
            echo "No input changed. Nothing to commit."
            exit 0
          fi
          {
            echo '```'
            cat "${RUNNER_TEMP}/summary.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/efficiencies
          if git diff --staged --quiet; then
            echo "Regenerated files are unchanged. Nothing to commit."
            exit 0
          fi
          git commit -F "${RUNNER_TEMP}/summary.txt"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            # Someone pushed to the branch while this ran; the regenerated
            # files don't conflict with anything else, so rebase and retry.
            echo "Push rejected (attempt ${attempt}/5), rebasing onto latest and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          # Don't block the deploy: it uses the regenerated files regardless,
          # and the next run regenerates again because the repo is still stale.
          echo "::warning::Could not push regenerated efficiency data after 5 attempts; the next run will retry."
      - name: Upload efficiency data
        uses: actions/upload-artifact@v7
        with:
          name: efficiency-data
          path: data/efficiencies/
          retention-days: 1
  attention:
    # Emails new entries in the shop packs' attention list by keeping one
    # GitHub issue (label pack-attention) in step with it -- see
    # tools/pack_attention_issue.py. Separate from the build on purpose: if it
    # fails, the run shows as failed (and that's emailed) but the deploy
    # doesn't wait for it or depend on it.
    runs-on: ubuntu-latest
    needs: regenerate
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use regenerated efficiency data
        uses: actions/download-artifact@v8
        with:
          name: efficiency-data
          path: data/efficiencies/
      - name: Sync the attention issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pack_attention_issue.py
  build:
    runs-on: ubuntu-latest
    needs: regenerate
    env:
      DART_SASS_VERSION: 1.101.0
      GO_VERSION: 1.26.4
      HUGO_VERSION: 0.165.0
      NODE_VERSION: 24.16.0
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # Shallow clone (fetch-depth defaults to 1). This applies to the submodules too,
          # which is where it matters: themes/blowfish has a large history, and every
          # auto-sync commit in assets/game_img adds binary image data that stays in
          # history permanently, so a full clone gets slower every day.
          # Safe because nothing here reads git history -- enableGitInfo is unset and the
          # build passes no --enableGitInfo, so Hugo only needs the pinned working trees.
          # If you ever enable enableGitInfo for git-derived lastmod dates, restore
          # fetch-depth: 0.
      - name: Use regenerated efficiency data
        uses: actions/download-artifact@v8
        with:
          name: efficiency-data
          path: data/efficiencies/
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          curl -sLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi
      - name: Configure Git
        run: |
          git config --global core.quotepath false
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build the site
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5