# Hand-edited rules for the shop packs page. Event packs come from
# assets/game_img/processed/shop_packs.json (scraped monthly from the CN wiki);
# EN names, sale windows and real EN prices come from EN game data
# (shop_client_table.json) by each pack's goodId once EN sells it. This file
# holds only what the data can't supply. Items are valued with the `packs`
# profile (value_rules.yaml). Edit this file, then rerun the generator; never
# hand-edit the generated JSON.
#
# Item ids are the game's (excel-*/item_table.json): 4001 LMD, 4002 Originite
# Prime, 4003 Orundum, 7003 Headhunting Permit, 7004 Ten-roll Headhunting
# Permit, 3211 / 3212 / 3213 Chip / Chip Pack / Dualchip (any class -- all
# classes share one value), 3301-3303 Skill Summaries, mod_unlock_token Module
# Data Block. Pseudo-items: `xp` is that much operator XP, valued at
# value_rules.yaml -> packs: xp_value; `selector` is a 6★ operator selector
# (not valued -- a pack holding one shows a note instead of numbers).

# ─────────────────────────────────────────────────────────────────────────────
# How a pack is measured (the sheet's CALCS - Packs maths)
#
#   pulls          = headhunting pulls in the pack (permits, Orundum / 600)
#   OP             = Originite Prime in the pack
#   material value = everything else, in sanity
#   total OP worth = material value / 135 + OP + pulls x 600/180
#   $ per OP       = USD / total OP worth          (all contents)
#   total pulls    = pulls + OP x 180/600
#   $ per pull     = USD / total pulls             (pulls and OP only)
# ─────────────────────────────────────────────────────────────────────────────
pulls:
  orundum_per_pull: 600
  orundum_per_op: 180          # the OP -> Orundum exchange
  # Items that are pulls, not materials, and how many pulls each is worth.
  items:
    "7003": 1
    "7004": 10
  # Banner permits get a new item id (and name) every time they appear, so
  # they're recognised by item type (shop_packs.json records it, category
  # "Headhunting"). Each pull is worth a standard pull, even when it can only
  # be used on one banner -- the page notes the restriction (note banner_only).
  item_types:
    EXCLUSIVE_TKT_GACHA: 1       # one banner only
    EXCLUSIVE_TKT_GACHA_10: 10   # one banner only
    LIMITED_TKT_GACHA_10: 10
    LINKAGE_TKT_GACHA: 1
    LINKAGE_TKT_GACHA_10: 10
  # What to call a permit EN has no name for yet (CN names them after the
  # banner, e.g. 海渊巡游十连寻访凭证). Once EN game data names it, that wins.
  item_type_names:
    EXCLUSIVE_TKT_GACHA: Banner Specific 1 Roll
    EXCLUSIVE_TKT_GACHA_10: Banner Specific 10 Roll
  # Kernel pulls (classic_gacha, classic_gacha_10, CLASSIC_TKT_GACHA*) count
  # for nothing -- avoid Kernel. α/β/γ "one of three" vouchers
  # (VOUCHER_CGACHA) and operator selectors aren't valued at all; packs
  # holding them show a note instead of numbers.

# ─────────────────────────────────────────────────────────────────────────────
# Colours (the sheet's thresholds). At or below `green` is green, at or below
# `yellow` is yellow, above is red.
#   green  = better than the double-OP packs: buy these first
#   yellow = better than the $100 OP pack without the double bonus: buy only
#            after the double-OP packs are used up
#   red    = worse than any OP pack: don't buy
# ─────────────────────────────────────────────────────────────────────────────
colours:
  per_op: {green: 0.38, yellow: 0.54}
  per_pull: {green: 1.25, yellow: 1.81}

# ─────────────────────────────────────────────────────────────────────────────
# CNY -> USD price map
#
# For packs EN hasn't sold yet (once EN sells a pack, its real price comes from
# EN game data). Values are store prices ($4.99, not $5). Checked 2026-11-09
# against every pack sold on both servers (CN yuan vs EN cents for the same
# goodId); `seen` is how many such packs agreed, and none disagreed.
# `estimated: true` = no EN sale to confirm it yet -- update when one appears.
# ─────────────────────────────────────────────────────────────────────────────
price_map:
  6:   {usd: 0.99,  seen: 6}
  12:  {usd: 1.99,  estimated: true}
  24:  {usd: 3.99,  estimated: true}
  30:  {usd: 4.99,  seen: 60}
  45:  {usd: 6.99,  seen: 12}
  58:  {usd: 8.99,  seen: 4}     # banner headhunting bundles (Rage of the Many, Command: Reconstruction)
  68:  {usd: 9.99,  seen: 68}
  78:  {usd: 11.99, estimated: true}
  98:  {usd: 14.99, seen: 23}
  128: {usd: 19.99, seen: 16}
  168: {usd: 25.99, seen: 25}
  198: {usd: 29.99, seen: 20}
  328: {usd: 49.99, seen: 7}

# ─────────────────────────────────────────────────────────────────────────────
# Expected EN start dates, by CN event id (shop_packs.json -> event.id).
#
# Upcoming events are listed in CN release order, which EN mostly follows.
# Add a line here only for an event that breaks that order. Once EN game data
# has the event, its real dates win and the line can be deleted.
# ─────────────────────────────────────────────────────────────────────────────
event_dates:
  # April Fools runs on 1 April on both servers, so EN gets CN's event the
  # following year: act7fun was CN 2026-04-01 and should be EN 2027-04-01.
  act7fun: 2027-04-01

# ─────────────────────────────────────────────────────────────────────────────
# EN event names, by CN event id, for events EN game data doesn't have yet (the
# EN name is usually announced before the update that adds it). Once EN data
# has the event, its name wins and the line can be deleted.
# ─────────────────────────────────────────────────────────────────────────────
event_names:
  act50side: Thunder in the Azure Dream             # 泡影苍霆
  act24sre: A Flurry to the Flame Rerun             # 落叶逐火·复刻
  crisis_v2_season_5_1: CCBP#5 - Obliteration       # 涤墨作战
  act21mini: Bolívar Diagnosed                      # 丛林症结
  act53side: Till the Lands Become an Orange        # 直到大地变成一颗酸橙
  act54side: Sur le lac lune vivante                # 月行水上
  act3break: "Vector Breakthrough #3"               # 矢量突破#3 拟生态
  act52side: Yet Another Wave                       # 昨日海
  act9switch: My Little Pony Collab
  act7fun: April Fools
  act55side: Vremva, v Put'!
  act3autochess: "Stronghold Protocol: Regulation"

# ─────────────────────────────────────────────────────────────────────────────
# The order packs are listed in within an event: by group, then price, high to
# low. The generator puts each pack in a group from its contents, ignoring
# Originite Prime, LMD and cosmetics:
#   funding      nothing else
#   chips        class chips/dualchips (plus Skill Summaries)
#   modules      Module Data Blocks / Data Supplements only
#   materials    material vouchers only
#   training     Training Apparatus, Invitation Letters, Skill Training Packs
#   headhunting  pulls of any kind, Kernel permits, selectors
#   bundles      anything mixed
# A group missing from this list sorts last. Not shown on the page.
# ─────────────────────────────────────────────────────────────────────────────
pack_groups: [bundles, headhunting, training, modules, materials, funding, chips]

# ─────────────────────────────────────────────────────────────────────────────
# Per-pack overrides, keyed by goodId (shop_packs.json -> goodId, also shown in
# the generator's "needs attention" list). Rarely needed: EN names and prices
# come from game data. Any of:
#   name:     EN name to show         usd:    price to use
#   notes:    [note keys, below]      hidden: true (leave the pack off the page),
#                                     or false to show a cosmetic pack (those
#                                     -- UI items and nothing of material value
#                                     -- are hidden by default)
#   contents: {item id: count}        -- replaces the scraped contents entirely
#   group:    one of pack_groups (below), when the automatic one is wrong
# Example:
#   GP_Once_498:
#     name: Heavy Funding Pack
#     usd: 6.99
# ─────────────────────────────────────────────────────────────────────────────
overrides: {}

# ─────────────────────────────────────────────────────────────────────────────
# Notes shown on the page. Packs refer to them by key; the generator also adds
# some automatically (kernel, selector, random_of_3, banner_only, upcoming).
# ─────────────────────────────────────────────────────────────────────────────
notes:
  module_materials: >-
    Module upgrade materials (Data Supplement Sticks and Instruments) aren't
    counted: they can't be farmed, and Module Data Blocks limit module
    upgrades anyway.
  module_blocks: >-
    Module Data Blocks are valued based on red certificates, but red
    certificate purchases are limited, so they may be worth more if you're
    short on time.
  vouchers: >-
    Material vouchers are valued at the average of the most valuable materials
    they can buy, so cheap picks like Rocks and Kohl don't drag them down.
  kernel: >-
    Kernel pulls aren't counted (don't roll on Kernel banners).
  tickets: >-
    Training Invitation Letters and Skill Training Packs are valued at the
    average cost across every operator of their rarity.
  selector: >-
    6★ selector packs aren't valued, since it would be nearly impossible to
    do. They are by far the best purchase available (except the monthly
    card): get them if an operator you'd use is on offer.
  upcoming: >-
    Contents and names come from the CN server and EN prices are estimated.
    They're usually right, but aren't official until the packs go live on EN.
  random_of_3: >-
    "One of three" packs are generally poor value: they cost only $4 less than
    the no-luck selector, so buy that first. Only buy one if you'd be happy
    with any of the three.
  banner_only: >-
    These pulls can only be used on that event's banner.
  dont_buy: >-
    Don't buy this one.

